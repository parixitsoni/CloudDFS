services:
  # Metadata Coordinator & Node Service on Render
  - type: web
    name: clouddfs-coordinator
    env: node
    buildCommand: npm install && npm run build
    startCommand: node --loader ts-node/esm apps/server/src/index.ts --role=COORDINATOR --port=10000
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: ROLE
        value: COORDINATOR
      - key: DATABASE_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: clouddfs-data
